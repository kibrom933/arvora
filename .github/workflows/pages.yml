# Udgiver forsiden, demoen og appen på GitHub Pages ved hvert push til main (bygger og skubber til grenen gh-pages).
#   https://kibrom933.github.io/arvora/        forsiden
#   https://kibrom933.github.io/arvora/demo/   prototypen
#   https://kibrom933.github.io/arvora/app/    appen (mod Arvora dev)
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: tools/build-site.sh /arvora/
        env:
          VITE_SUPABASE_URL: https://jqulxozrejhrinqxyffr.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_V6RthOBvFUAWNJBgBU-fVA_objvrTa3
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tests/out/site-dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Udgivet fra ${{ github.sha }}"
