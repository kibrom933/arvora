<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arvora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..600&family=Hanken+Grotesk:wght@400;500;600;700&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: et hjem, der tømmes med omtanke. Blomme, porcelæn og messing; ting som mærkesedler med nummer, arvinger som kasser med håndskrevne navne, fem trin fra billede til underskrift. */
:root{
  --paper:#F7F4F6; --card:#FFFFFF; --ink:#2A2233; --soft:#6E6478; --line:#E2DBE6;
  --forest:#4A2E5C; --forest-2:#7A4E8F; --on-forest:#F8F2F3; --kraft:#C9963A; --kraft-ink:#2B1E05;
  --ochre:#C9963A; --mint:#E6EFE7; --good:#2F6B4F; --warn:#B4412A; --warn-soft:#F9E3DC;
  --display:"Fraunces", Georgia, "Times New Roman", serif; --hand:"Caveat", "Segoe Print", cursive;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:6px; --shadow:0 1px 0 rgba(27,36,32,.04), 0 8px 24px -14px rgba(27,36,32,.35); --name-mix:100%;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161020; --card:#1F1729; --ink:#F1EBF3; --soft:#B3A8BC; --line:#352B40;
  --forest:#3A2449; --forest-2:#C9A6DA; --on-forest:#F5EFF6; --kraft:#D4A348; --kraft-ink:#2B1E05;
  --ochre:#C9963A; --mint:#1F2E24; --good:#8ED0A6; --warn:#FF9F86; --warn-soft:#3C1E17;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.7); --name-mix:55%; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161020; --card:#1F1729; --ink:#F1EBF3; --soft:#B3A8BC; --line:#352B40;
  --forest:#3A2449; --forest-2:#C9A6DA; --on-forest:#F5EFF6; --kraft:#D4A348; --kraft-ink:#2B1E05;
  --ochre:#C9963A; --mint:#1F2E24; --good:#8ED0A6; --warn:#FF9F86; --warn-soft:#3C1E17;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.7); --name-mix:55%; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--forest)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
/* top */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--forest);color:var(--on-forest)}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:0;text-decoration:none}
.logo svg{flex:0 0 auto}
.bo{font-size:13.5px;opacity:.8;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.bo{display:none}}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.12)}
@media (max-width:380px){.pill{display:none}}
.grow{flex:1}
.ghost{font:inherit;font-size:13px;font-weight:600;color:var(--on-forest);background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap}
nav.steps{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
nav.steps a{flex:0 0 auto;display:flex;gap:8px;align-items:center;text-decoration:none;font-weight:600;font-size:14px;padding:7px 12px 7px 8px;border-radius:99px;color:rgba(244,242,234,.72)}
nav.steps a .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;border:1px solid rgba(255,255,255,.3)}
nav.steps a.done .n{background:var(--kraft);border-color:var(--kraft);color:var(--kraft-ink)}
nav.steps a[aria-current="page"]{background:var(--on-forest);color:var(--forest)}
nav.steps a[aria-current="page"] .n{border-color:var(--forest)}
main{padding-block:32px 72px;min-height:60vh}
/* type */
h1{font-family:var(--display);font-weight:500;font-size:clamp(30px,4.6vw,46px);line-height:1.08;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.005em;line-height:1.22;margin:0 0 8px;text-wrap:balance}
h3{font-size:16px;margin:0}
.lead{color:var(--soft);font-size:17px;max-width:60ch;margin:0 0 26px}
.eyebrow{font-family:var(--hand);font-size:24px;line-height:1;color:var(--forest-2);margin-bottom:6px;transform:rotate(-2deg);display:inline-block}
.hand{font-family:var(--hand);font-weight:700}
.soft{color:var(--soft)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* controls */
.btn{font:inherit;font-weight:700;border-radius:99px;padding:11px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.go{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.btn.ochre{background:var(--ochre);border-color:var(--ochre);color:#1a1300}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--soft);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
/* overview */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.memorial{display:flex;gap:18px;align-items:center;margin-bottom:20px}
.portrait{width:84px;height:84px;border-radius:50%;flex:0 0 auto;background:var(--kraft);display:grid;place-items:center;color:var(--kraft-ink);font-family:var(--display);font-weight:500;font-size:34px;border:4px solid var(--card);box-shadow:var(--shadow)}
.years{font-family:var(--mono);font-size:13px;color:var(--soft)}
.track{display:grid;gap:0;padding:6px 0}
.trk{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.trk:first-child{border-top:0}
.trk .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;border:1.5px solid var(--line);color:var(--soft)}
.trk.done .dot{background:var(--good);border-color:var(--good);color:var(--card)}
.trk.now .dot{border-color:var(--ochre);color:var(--ochre);box-shadow:0 0 0 4px color-mix(in srgb,var(--ochre) 18%,transparent)}
.trk b{display:block}
.trk small{color:var(--soft)}
.phone{width:min(300px,100%);margin-inline:auto;border-radius:38px;background:var(--ink);padding:12px;box-shadow:var(--shadow)}
.screen{border-radius:28px;background:var(--paper);padding:18px 14px 22px;min-height:400px;display:flex;flex-direction:column;gap:10px}
.screen .who{font-size:12px;text-align:center;color:var(--soft);font-weight:600}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:14px;line-height:1.45;max-width:92%}
.bubble a{color:var(--forest-2);font-weight:700}
.rooms{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--soft);cursor:default}
button.chip{cursor:pointer;font-family:inherit}
button.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.chip.good{background:var(--mint);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.will{background:var(--kraft);border-color:transparent;color:var(--kraft-ink)}
/* tags (items) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.tag{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.tag .pic{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;position:relative}
.tag .pic svg{width:72%;height:auto}
.tag .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lot{position:absolute;top:12px;right:12px;z-index:2;background:var(--kraft);color:var(--kraft-ink);font-family:var(--mono);font-size:11.5px;font-weight:500;padding:4px 10px 4px 16px;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%);transform:rotate(4deg)}
.lot::before{content:"";position:absolute;left:6px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--card)}
.tag .txt{padding:12px 14px 14px;display:grid;gap:4px;flex:1;align-content:start}
.tag .name{font-weight:700;line-height:1.3}
.tag .room{font-size:12.5px;color:var(--soft)}
.tag .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.addbar{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end;padding:16px;margin-bottom:20px}
@media (max-width:760px){.addbar{grid-template-columns:1fr 1fr}.addbar .wide{grid-column:1/-1}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
/* heirs */
.heirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.heir{padding:18px;display:grid;gap:12px;align-content:start}
.heir .top{display:flex;gap:12px;align-items:center}
.heir .nm{font-family:var(--hand);font-size:32px;line-height:1;font-weight:700;color:color-mix(in srgb,var(--c,var(--ink)) var(--name-mix),#fff)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:0 0 auto}
/* wishes */
.method{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;max-width:760px}
@media (max-width:560px){.method{grid-template-columns:1fr}}
.method button{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.method button[aria-pressed="true"]{border-color:var(--forest);background:color-mix(in srgb,var(--mint) 60%,var(--card))}
.method b{display:block;margin-bottom:2px}
.method span{font-size:13.5px;color:var(--soft)}
.who-sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.who-sw button{font:inherit;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:700}
.who-sw button[aria-pressed="true"]{border-color:var(--forest)}
.who-sw .av{width:32px;height:32px;font-size:14px}
.purse{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:10;display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 18px;margin-bottom:20px}
.coins{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:200px}
.coin{width:14px;height:14px;border-radius:50%;background:var(--ochre);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);transition:transform .2s,opacity .2s}
.coin.spent{opacity:.18;transform:scale(.75)}
.pips{display:flex;gap:3px;flex-wrap:wrap;min-height:10px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--ochre)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:6px}
.stepper button{font:inherit;font-size:18px;line-height:1;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:700}
.stepper .val{font-family:var(--mono);font-size:15px;min-width:52px;text-align:center}
.secret{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--soft);margin:-8px 0 18px}
/* reveal */
.stage{display:grid;gap:24px}
.pile{position:relative;min-height:180px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:22px;padding:24px}
.pile .heap{position:relative;width:220px;height:130px}
.pile .heap span{position:absolute;left:50%;top:50%;width:120px;height:34px;margin:-17px 0 0 -60px;border-radius:6px;background:var(--kraft);color:var(--kraft-ink);font-family:var(--mono);font-size:11px;display:grid;place-items:center;box-shadow:var(--shadow)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.box{position:relative;padding:22px 18px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--kraft) 55%,var(--card)) 0 64px,var(--card) 64px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.box::before{content:"";position:absolute;left:50%;top:0;width:46px;height:64px;margin-left:-23px;background:color-mix(in srgb,var(--kraft) 30%,var(--card));opacity:.7}
.box .label{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:22px}
.box .label .hand{font-size:38px;line-height:.9;color:var(--kraft-ink)}
.fair{display:grid;gap:6px;margin-bottom:12px}
.bar2{height:8px;border-radius:99px;background:var(--paper);overflow:hidden}
.bar2 span{display:block;height:100%;border-radius:99px;transition:width 1s ease}
.box ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.it{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--paper);will-change:transform}
.it .mini{width:40px;height:30px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto}
.it .mini svg{width:36px;height:auto}
.it .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.25}
.it .p{font-family:var(--mono);font-size:11.5px;color:var(--soft);white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.chk{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.chk .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--mint);color:var(--good);font-weight:800}
.chk.no .ic{background:var(--warn-soft);color:var(--warn)}
.chk.lod .ic{background:var(--kraft);color:var(--kraft-ink)}
.chk b{display:block;font-size:14.5px}
.chk small{color:var(--soft);font-size:13px;line-height:1.4;display:block}
.rest{padding:18px;display:grid;gap:12px}
.rest .row .chip{background:var(--paper)}
table.st{border-collapse:collapse;width:100%;font-size:14px}
table.st th,table.st td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
table.st .r{text-align:right}
.tw{overflow-x:auto}
/* sign */
.sign{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:start}
@media (max-width:860px){.sign{grid-template-columns:1fr}}
.sig{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:end;padding:14px 16px}
.sig form{display:grid;grid-template-columns:minmax(110px,1fr) 88px auto;gap:8px;align-items:center}
.sig form input.pin{text-align:center;letter-spacing:.2em;padding-inline:6px}
.sig form input.pin::placeholder{letter-spacing:0}
.sig form small{grid-column:1/-1;font-size:12.5px;line-height:1.35}
.sig form small:empty{display:none}
@media (max-width:560px){.sig form{grid-column:1/-1;grid-template-columns:minmax(0,1fr) 84px}.sig form button{grid-column:1/-1;justify-content:center}}
.forgot{font-size:13.5px;color:var(--soft);justify-self:stretch}
.forgot summary{cursor:pointer;font-weight:700;color:var(--forest-2)}
.forgot p{margin:8px 0}
.copytext{width:100%;font:12.5px/1.5 var(--mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);resize:vertical}
.sig .line{border-bottom:1.5px solid var(--ink);min-height:44px;display:flex;align-items:flex-end;font-family:var(--hand);font-size:30px;line-height:1;color:var(--forest-2);padding-bottom:2px}
.sig .line:empty::after{content:"Underskrift";font-family:var(--body);font-size:12px;color:var(--soft)}
.doc{position:relative;overflow:hidden;padding:26px 24px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);font-size:13.5px}
.doc h3{font-family:var(--display);font-weight:500;font-size:20px;margin-bottom:4px}
.doc .who{margin-top:14px;font-weight:700}
.doc ul{margin:4px 0 0;padding-left:18px}
.stamp{position:absolute;right:18px;top:20px;border:3px solid var(--good);color:var(--good);font-family:var(--mono);font-weight:500;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:6px;transform:rotate(-9deg) scale(1);font-size:13px;opacity:.9;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-9deg) scale(2.2);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.9}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(140%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:30;transition:transform .3s;max-width:calc(100% - 32px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.aibox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 18px;margin-bottom:14px;border:2px dashed var(--forest-2);box-shadow:none}
.aibox .grow{min-width:220px}
.lock{max-width:520px;padding:26px;display:grid;gap:12px;justify-items:start}
.lock .av{width:56px;height:56px;font-size:22px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.why{margin-top:12px;font-size:13.5px}
.why summary{cursor:pointer;font-weight:700;color:var(--forest-2)}
.why ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.why li{background:none;padding:0}
.nmedit{font-weight:700}
footer{border-top:1px solid var(--line);padding-block:20px;font-size:13px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#oversigt" aria-label="Arvora, til oversigten">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="var(--kraft)"/><path d="M14 14V1M14 14l11.3 6.5M14 14L2.7 20.5" stroke="var(--forest)" stroke-width="1.8" stroke-linecap="round"/></svg>
        Arvora
      </a>
      <span class="bo" id="boName"></span>
      <span class="pill">Eksempel</span>
      <span class="grow"></span>
      <button class="ghost" id="reset" type="button">Start forfra</button>
    </div>
    <nav class="steps" aria-label="Trin">
      <a href="#oversigt" data-v="oversigt"><span class="n">⌂</span>Oversigt</a>
      <a href="#ting" data-v="ting"><span class="n">1</span>Ting</a>
      <a href="#arvinger" data-v="arvinger"><span class="n">2</span>Arvinger</a>

/* ---------- Motor ---------- */
/* Lodtrækning: hvert bo får ét lod (S.lod), når det oprettes. Ud fra loddet får hver arving et fast,
   tilfældigt tal for hver ting. Står nogen helt lige, vinder det højeste tal. Det samme lod giver altid
   det samme udfald, så der kan ikke trækkes om. I den rigtige version trækkes og gemmes loddet på serveren. */
const lodtal=(h,i)=>{let x=(S.lod>>>0)||1;const s=h.id+'|'+(i.id||i);for(let k=0;k<s.length;k++){x=Math.imul(x^s.charCodeAt(k),2654435761)>>>0;x^=x>>>15}
 x=Math.imul(x^(x>>>16),2246822507)>>>0;x=Math.imul(x^(x>>>13),3266489909)>>>0;return((x^(x>>>16))>>>0)/4294967296};
const og=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' og '+a[a.length-1];
function solvePoints(){
 const HS=S.heirs, F=free(); const v=(h,i)=>(S.pts[h.id]||{})[i.id]||0;
 const wanted=F.filter(i=>HS.some(h=>v(h,i)>0)), rest=F.filter(i=>!HS.some(h=>v(h,i)>0));
 let A; const U=h=>A[h.id].reduce((a,i)=>a+v(h,i),0);
 const obj=()=>{let p=0,s=0;for(const h of HS){const u=U(h);if(u>0){p++;s+=h.w*Math.log(u)}}return p*1e6+s};
 /* Held: summen af lodtal for den fordeling, der ligger nu. Den tæller kun mellem fordelinger, der er præcis lige gode. */
 const luck=()=>{let s=0;for(const h of HS)for(const i of A[h.id])s+=lodtal(h,i);return s};
 const E=1e-9, better=(n,l,cn,cl)=>n>cn+E||(n>cn-E&&l>cl+1e-12);
 const top=i=>Math.max(...HS.map(h=>v(h,i)));
 /* Ét forsøg: læg tingene ud i den givne rækkefølge, og flyt og byt derefter, så længe det bliver bedre. */
 const attempt=(items,hs)=>{A={};HS.forEach(h=>A[h.id]=[]);
  items.forEach(i=>{let best=null,bs=-Infinity;for(const h of hs){if(!v(h,i))continue;const u=U(h);const s=(Math.log(u+v(h,i))-Math.log(u+1e-9))*h.w;if(s>bs){bs=s;best=h}}A[best.id].push(i)});
  let imp=true,g=0;
  while(imp&&g++<300){imp=false;let cur=obj(),cl=luck();
   /* break: en ting, der er flyttet, må ikke prøves hos flere, ellers ender den i to kasser */
   for(const a of hs)for(const i of [...A[a.id]])for(const b of hs){if(a===b||!v(b,i))continue;
    A[a.id]=A[a.id].filter(x=>x!==i);A[b.id].push(i);const n=obj(),l=luck();if(better(n,l,cur,cl)){cur=n;cl=l;imp=true;break}else{A[b.id].pop();A[a.id].push(i)}}
   sw: for(const a of hs)for(const b of hs){if(a.id>=b.id)continue;
    for(const i of [...A[a.id]])for(const j of [...A[b.id]]){
     const s1=()=>{A[a.id]=A[a.id].map(x=>x===i?j:x);A[b.id]=A[b.id].map(x=>x===j?i:x)},s2=()=>{A[a.id]=A[a.id].map(x=>x===j?i:x);A[b.id]=A[b.id].map(x=>x===i?j:x)};
     s1();const n=obj(),l=luck();if(better(n,l,cur,cl)){cur=n;cl=l;imp=true;break sw}else s2()}
    /* to arvinger kan også bytte hele kassen */
    const ta=A[a.id];A[a.id]=A[b.id];A[b.id]=ta;const n=obj(),l=luck();if(better(n,l,cur,cl)){cur=n;cl=l;imp=true;break sw}else{A[b.id]=A[a.id];A[a.id]=ta}}}
  return [obj(),luck()]};
 /* Første forsøg går frem i loddets rækkefølge, ikke listens. De næste prøver andre rækkefølger.
    Den bedste fordeling vinder. Er to præcis lige gode, vinder den med mest held i lodtrækningen.
    Alt det tilfældige kommer fra boets lod, så de samme ønsker altid giver den samme fordeling. */
 const draw=[...HS].sort((a,b)=>lodtal(b,'*')-lodtal(a,'*'));
 let [bestV,bestL]=attempt([...wanted].sort((a,b)=>top(b)-top(a)),draw), bestA=A;
 let seed=(S.lod|0)||20261109;const rnd=()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const mix=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(rnd()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
 const tries=HS.length<2||wanted.length<2?0:wanted.length*HS.length>1500?6:40;
 for(let t=0;t<tries;t++){const [val,l]=attempt(mix(wanted),mix(HS));if(better(val,l,bestV,bestL)){bestV=val;bestL=l;bestA=A}}
 A=bestA;
 /* Hvad blev afgjort af loddet? Alt, der kunne være endt anderledes, uden at fordelingen blev dårligere. */
 const keep=A, base=obj(), lod=[], lodIds=new Set(), met=new Set(), key=(a,b)=>a.id<b.id?a.id+'|'+b.id:b.id+'|'+a.id;
 const alt=fn=>{const B={};HS.forEach(h=>B[h.id]=[...keep[h.id]]);A=B;fn(B);const t=Math.abs(obj()-base)<=E;A=keep;return t};
 for(const a of HS)for(const i of keep[a.id]){
  const oth=HS.filter(b=>b!==a&&v(b,i)>0&&alt(B=>{B[a.id]=B[a.id].filter(x=>x!==i);B[b.id].push(i)}));if(!oth.length)continue;
  const grp=[a,...oth].sort((x,y)=>HS.indexOf(x)-HS.indexOf(y)),p=v(a,i),eq=grp.every(h=>v(h,i)===p);lodIds.add(i.id);oth.forEach(b=>met.add(key(a,b)));
  lod.push(`${i.name}: ${og(grp.map(h=>h.name))} ${eq?`gav ${grp.length>2?'alle':'begge'} ${p} p`:'stod lige'}. Loddet faldt på ${a.name}.`)}
 if(wanted.length<=60)for(const a of HS)for(const b of HS){if(a.id>=b.id)continue;
  for(const i of keep[a.id])for(const j of keep[b.id]){if(lodIds.has(i.id)||lodIds.has(j.id))continue;
   if(alt(B=>{B[a.id]=B[a.id].map(x=>x===i?j:x);B[b.id]=B[b.id].map(x=>x===j?i:x)})){lodIds.add(i.id);lodIds.add(j.id);met.add(key(a,b));
    lod.push(`${og([a.name,b.name])} stod lige om ${i.name} og ${j.name}. Loddet gav ${a.name} ${i.name}.`)}}
  if(!met.has(key(a,b))&&keep[a.id].length+keep[b.id].length>0&&alt(B=>{const t=B[a.id];B[a.id]=B[b.id];B[b.id]=t}))
   lod.push(`${og([a.name,b.name])} stod helt lige. Loddet afgjorde, hvem der fik hvilken kasse.`)}
 const ef=[];for(const a of HS)for(const b of HS){if(a===b)continue;const ua=U(a);const vs=A[b.id].map(i=>v(a,i));const ub=vs.reduce((s,x)=>s+x,0)-(vs.length?Math.max(...vs):0);if(ua/a.w+1e-9<ub/b.w)ef.push([a,b])}
 const out={};HS.forEach(h=>out[h.id]=[...A[h.id].map(i=>({i,val:v(h,i)+' p',lod:lodIds.has(i.id)}))]);
 S.items.filter(i=>i.will&&out[i.will]).forEach(i=>out[i.will].push({i,val:'testamente',will:true}));
 /* zero: dem, der ønskede noget, men ikke fik noget af det */
 return {out,rest,ef,lod,lodIds,zero:HS.filter(h=>used(h.id)>0&&U(h)===0),score:h=>U(h),of:h=>used(h.id)};
}
function solveBids(){
 const HS=S.heirs;const b=(h,i)=>(S.bids[h.id]||{})[i.id]||0;const out={};HS.forEach(h=>out[h.id]=[]);const rest=[],lod=[],lodIds=new Set();let V=0;const price={};
 for(const i of free()){const top=Math.max(0,...HS.map(h=>b(h,i)));if(!top){rest.push(i);continue}
  /* Højeste bud vinder. Byder flere det samme, afgør loddet det. */
  const tied=HS.filter(h=>b(h,i)===top),best=tied.length>1?[...tied].sort((x,y)=>lodtal(y,i)-lodtal(x,i))[0]:tied[0];
  if(tied.length>1){lodIds.add(i.id);lod.push(`${i.name}: ${og(tied.map(h=>h.name))} bød ${tied.length>2?'alle':'begge'} ${kr(top)} Loddet faldt på ${best.name}.`)}
  price[i.id]=top;V+=top;out[best.id].push({i,val:kr(top),lod:tied.length>1})}
 S.items.filter(i=>i.will&&out[i.will]).forEach(i=>out[i.will].push({i,val:'testamente',will:true}));
 const W=HS.reduce((a,h)=>a+h.w,0);const settle=HS.map(h=>{const got=out[h.id].filter(x=>!x.will).reduce((a,x)=>a+price[x.i.id],0);const share=V*h.w/W;return {h,got,share,diff:got-share}});
 return {out,rest,price,V,settle,lod,lodIds,zero:[]};
}

/* ---------- Animation: tingene flyver i kasserne ---------- */
function flyIn(){
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const bars=()=>document.querySelectorAll('.bar2 span').forEach(s=>s.style.width=s.dataset.w+'%');
 if(reduce){bars();return}
 const items=[...document.querySelectorAll('[data-fly]')];const box=$('#boxes').getBoundingClientRect();
 const cx=box.left+box.width/2, cy=box.top-60;
 items.forEach((el,k)=>{const r=el.getBoundingClientRect();el.style.transition='none';el.style.opacity='0';
  el.style.transform=`translate(${cx-(r.left+r.width/2)}px,${cy-(r.top+r.height/2)}px) rotate(${(k%5-2)*8}deg) scale(.7)`});
 requestAnimationFrame(()=>requestAnimationFrame(()=>{items.forEach((el,k)=>{el.style.transition=`transform .7s cubic-bezier(.2,.9,.25,1.15) ${k*90}ms, opacity .3s ${k*90}ms`;el.style.opacity='1';el.style.transform='none'});
  setTimeout(bars,items.length*90+500)}));
}

  /* Hvis browseren ikke må kopiere, vises teksten markeret, så man selv kan kopiere den */
  const manual=()=>{$('#copied').textContent='Kopiér selv teksten herunder';let ta=$('#copyText');if(!ta){ta=document.createElement('textarea');ta.id='copyText';ta.readOnly=true;ta.rows=10;ta.className='copytext';ta.setAttribute('aria-label','Fordelingslisten som tekst');b.closest('.row').after(ta)}ta.value=t;ta.focus();ta.select()};
  try{navigator.clipboard.writeText(t).then(ok,manual)}catch(err){manual()}}
});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(t.id==='aiPics'&&t.files.length&&SAMPLE&&!busy){aiAdd(t.files);return}
 if(d.rename){closeEdit(t,true);return}
 if(d.bid){const b=S.bids[me]=S.bids[me]||{};const v=Math.max(0,Math.round(+t.value||0));if(v)b[d.bid]=v;else delete b[d.bid];save();render()}
 if(d.w){H(d.w).w=+t.value;invalidate();save();toast('Arvelod ændret')}
 if(d.photo&&t.files[0]){const id=d.photo,fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,520/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const ok=keepPhoto(id,c.toDataURL('image/jpeg',.8));render();toast(ok?'Billedet er gemt':NOROOM)};im.src=fr.result};fr.readAsDataURL(t.files[0])}
});
/* Navnefeltet: Enter gemmer, Esc fortryder, og feltet lukker, når man trykker et andet sted */
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||!t.dataset.rename)return;if(e.key==='Enter'){e.preventDefault();closeEdit(t,true)}else if(e.key==='Escape')closeEdit(t,false)});
document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.rename)closeEdit(t,true)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='pinForm'){const v=$('#pin').value.trim();if(!/^\d{4}$/.test(v)){$('#pinMsg').textContent='Koden skal være 4 cifre.';return}
  if(!S.pins[me]){S.pins[me]=v;save();unlocked=me;render();toast('Koden er gemt')}else if(S.pins[me]===v){unlocked=me;render()}else{$('#pinMsg').textContent='Forkert kode. Prøv igen.'}return}
 if(f.id==='resetForm'){const v=$('#tovpin').value.trim();if(v!==S.pins[S.tov]){$('#resetMsg').textContent='Det er ikke '+H(S.tov).name+'s kode.';return}delete S.pins[me];save();render();toast(H(me).name+' kan nu vælge en ny kode');return}
 if(f.id==='addItem'){const n=$('#nName').value.trim();if(!n)return;S.items.push({id:'i'+Date.now(),no:++S.nextNo,name:n,group:$('#nGroup').value.trim()||'Andet',k:'thing',will:$('#nWill').value});invalidate();save();render();toast('Mærkeseddel sat på')}
 if(f.id==='addHeir'){const n=$('#hName').value.trim();if(!n)return;const id='h'+Date.now();S.heirs.push({id,name:n,rel:$('#hRel').value.trim()||'Arving',w:1,sig:''});S.pts[id]={};S.bids[id]={};S.submitted[id]=false;invalidate();save();render();toast(`Invitation sendt til ${n} (kun i eksemplet)`)}
 /* Underskrift kræver ens egen kode. Den, der ikke har en kode endnu (fx fordi ønskerne kom ind på anden vis), vælger en her. */
 if(f.dataset.signform){const id=f.dataset.signform,h=H(id),code=f.querySelector('input.pin').value.trim(),msg=f.querySelector('[data-signmsg]');
  if(!/^\d{4}$/.test(code)){msg.textContent=S.pins[id]?'Skriv din kode på 4 cifre.':'Vælg først en kode på 4 cifre. Du bruger den også, hvis I deler igen.';return}
  if(S.pins[id]&&S.pins[id]!==code){msg.textContent='Forkert kode. Kun '+h.name+' kan skrive under her.';return}
  if(!S.pins[id])S.pins[id]=code;
  h.sig=f.querySelector('input:not(.pin)').value.trim()||h.name;save();render();if(allSigned())toast('Alle har underskrevet. Fordelingen gælder.')}
});
function submitWishes(msg){S.submitted[me]=true;invalidate();save();const nx=S.heirs.find(h=>!S.submitted[h.id]);toast(msg);unlocked=null;if(nx){me=nx.id;render();scrollTo(0,0)}else location.hash='fordeling'}
render();
</script>
</body></html>
